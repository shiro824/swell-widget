<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>うねりライン</title>
<style>
  :root{
    --ink:#0b1a24;
    --foam:#f3f7f8;
    --sand:#d9c39a;
    --swell:#5fc2cc;
    --wind:#8fa3af;
    --offshore:#f2a94e;
    --good:#7fd499;
    --tide:#a493cc;
    --mute:#7e95a1;
    --hair:rgba(243,247,248,.1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--ink)}
  body{
    padding:20px 20px 24px;
    color:var(--foam);
    font-family:"Hiragino Sans","Noto Sans JP",-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  nav{
    display:flex;gap:6px;overflow-x:auto;
    margin:0 -20px 16px;padding:0 20px 8px;
    scrollbar-width:none;
  }
  nav::-webkit-scrollbar{display:none}
  nav button{
    flex:0 0 auto;
    background:none;border:1px solid var(--hair);border-radius:999px;
    color:var(--mute);font:inherit;font-size:12px;letter-spacing:.06em;
    padding:5px 13px;cursor:pointer;white-space:nowrap;transition:.15s;
  }
  nav button:hover{color:var(--foam);border-color:rgba(243,247,248,.3)}
  nav button[aria-current="true"]{
    background:var(--foam);border-color:var(--foam);color:var(--ink);font-weight:600;
  }

  .eyebrow{
    font-size:10px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--mute);margin:0 0 6px;
  }
  h1{margin:0;font-size:29px;font-weight:600;letter-spacing:.04em;line-height:1.1}
  h1 .geo{font-size:11px;color:var(--mute);letter-spacing:.1em;margin-left:10px;font-weight:400}

  .now{
    display:flex;gap:24px;align-items:baseline;flex-wrap:wrap;
    margin:18px 0 4px;padding-bottom:16px;border-bottom:1px solid var(--hair);
  }
  .metric .v{font-size:26px;font-weight:600;letter-spacing:.02em;font-variant-numeric:tabular-nums}
  .metric .v small{font-size:12px;font-weight:400;color:var(--mute);margin-left:3px}
  .metric .k{font-size:10px;letter-spacing:.14em;color:var(--mute);margin-top:3px}
  .metric.off .v{color:var(--offshore)}
  .metric.tide .v{color:var(--tide);font-size:21px}

  .day{margin-top:26px}
  .day-head{
    display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    font-size:11.5px;letter-spacing:.12em;color:var(--sand);margin-bottom:6px;
  }
  .day-head .peak{color:var(--mute);letter-spacing:.05em;font-variant-numeric:tabular-nums;white-space:nowrap}
  .badge{
    display:inline-flex;align-items:center;
    background:rgba(127,212,153,.13);color:var(--good);
    border:1px solid rgba(127,212,153,.35);border-radius:999px;
    font-size:10px;letter-spacing:.06em;padding:2px 9px;margin-left:8px;
    font-variant-numeric:tabular-nums;
  }
  svg{display:block;width:100%;height:auto;overflow:visible}

  .msg{padding:26px 0;color:var(--mute);font-size:13px;line-height:1.8}
  .msg b{color:var(--foam);font-weight:600}

  .note{
    margin-top:22px;padding:12px 15px;border:1px dashed var(--hair);border-radius:10px;
    font-size:11px;line-height:1.85;color:var(--mute);
  }

  footer{
    margin-top:18px;padding-top:12px;border-top:1px solid var(--hair);
    font-size:10px;letter-spacing:.06em;color:var(--mute);
    display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
  }
  .key{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .key i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}

  @media (max-width:420px){
    body{padding:16px 14px 20px}
    nav{margin:0 -14px 14px;padding:0 14px 8px}
    h1{font-size:23px}
    h1 .geo{display:block;margin:4px 0 0}
    .now{gap:16px}
    .metric .v{font-size:21px}
    .metric.tide .v{font-size:18px}
  }
</style>
</head>
<body>

<nav id="tabs" aria-label="スポット"></nav>

<p class="eyebrow">Open-Meteo Marine / <span id="rangeLabel">5日間</span></p>
<h1 id="spotName">—<span class="geo" id="geo"></span></h1>
<div id="now" class="now" hidden></div>
<div id="body" class="msg">うねりデータを取得しています…</div>
<div id="note"></div>

<footer>
  <div class="key">
    <span><i style="background:var(--swell)"></i>波高</span>
    <span><i style="background:var(--offshore)"></i>オフショア風</span>
    <span><i style="background:var(--wind)"></i>オン・サイド風</span>
    <span><i style="background:var(--tide)"></i>潮位</span>
    <span><i style="background:var(--good)"></i>おすすめ</span>
  </div>
  <div id="stamp"></div>
</footer>

<script>
/* ------------------------------------------------------------------
   設定
------------------------------------------------------------------ */
const ARC = 45;                  // オフショアと見なす中心角からの許容範囲（度）
const SPOTS = [
  { id:"torami",  name:"東浪見",       lat:35.365, lon:140.405, off:300 },
  { id:"katakai", name:"片貝新堤",     lat:35.516, lon:140.445, off:300 },
  { id:"sakuda",  name:"作田",         lat:35.585, lon:140.487, off:300 },
  { id:"shiina",  name:"椎名内",       lat:35.635, lon:140.553, off:305 },
  { id:"iioka",   name:"飯岡",         lat:35.703, lon:140.725, off:320 },
  { id:"hirai",   name:"鹿嶋平井",     lat:35.948, lon:140.680, off:200 },
  { id:"sante",   name:"トップサンテ", lat:35.885, lon:140.700, off:210 },
];

const FORECAST_DAYS = 5;
const HOUR_FROM = 3, HOUR_TO = 19;   // 表示する時間帯
const REC_HEIGHT_RATIO = 0.55;       // おすすめ判定：その日の最大波高に対する比率
const REC_MIN_HOURS    = 2;          // おすすめ判定：最低継続時間

const DIRS = ["北","北北東","北東","東北東","東","東南東","南東","南南東",
              "南","南南西","南西","西南西","西","西北西","北西","北北西"];
const compass = d => DIRS[Math.round(d / 22.5) % 16];
const angleGap = (a, b) => { const d = Math.abs(a - b) % 360; return d > 180 ? 360 - d : d; };
const hhmm = t => String(t.getHours()).padStart(2,"0") + ":" + String(t.getMinutes()).padStart(2,"0");
const $ = id => document.getElementById(id);

/* ---------- スポットタブ ---------- */
let current = SPOTS.find(s => s.id === location.hash.slice(1)) || SPOTS[0];

$("tabs").innerHTML = SPOTS.map(s =>
  `<button data-id="${s.id}" aria-current="${s.id === current.id}">${s.name}</button>`
).join("");

$("tabs").addEventListener("click", e => {
  const btn = e.target.closest("button");
  if (!btn) return;
  current = SPOTS.find(s => s.id === btn.dataset.id);
  history.replaceState(null, "", "#" + current.id);
  [...$("tabs").children].forEach(b =>
    b.setAttribute("aria-current", b.dataset.id === current.id));
  render();
});

$("rangeLabel").textContent = FORECAST_DAYS + "日間";

/* ---------- データ取得 ---------- */
const cache = new Map();

async function grab(url){
  const r = await fetch(url);
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

async function fetchSpot(spot){
  if (cache.has(spot.id)) return cache.get(spot.id);
  const q = `latitude=${spot.lat}&longitude=${spot.lon}&timezone=Asia%2FTokyo&forecast_days=${FORECAST_DAYS}`;
  const [sea, air] = await Promise.all([
    grab(`https://marine-api.open-meteo.com/v1/marine?${q}&hourly=wave_height,wave_period,sea_level_height_msl`),
    /* wind_speed_unit=ms を必ず付ける（既定は km/h） */
    grab(`https://api.open-meteo.com/v1/forecast?${q}&hourly=wind_speed_10m,wind_direction_10m&wind_speed_unit=ms`)
  ]);
  const lvl = sea.hourly.sea_level_height_msl || [];
  const rows = sea.hourly.time.map((t, i) => ({
    t : new Date(t),
    h : sea.hourly.wave_height[i],
    p : sea.hourly.wave_period[i],
    sl: lvl[i] ?? null,
    ws: air.hourly.wind_speed_10m[i],
    wd: air.hourly.wind_direction_10m[i]
  })).filter(r => r.h != null);
  if (!rows.length) throw new Error("データが空です");
  rows.forEach((r, i) => r.gi = i);
  cache.set(spot.id, rows);
  return rows;
}

/* ---------- 描画 ---------- */
async function render(){
  const spot = current;
  $("spotName").firstChild.nodeValue = spot.name;
  $("geo").textContent = `${spot.lat.toFixed(2)}N ${spot.lon.toFixed(2)}E`;
  $("now").hidden = true;
  $("body").className = "msg";
  $("body").textContent = "うねりデータを取得しています…";
  $("note").innerHTML = "";

  let rows;
  try {
    rows = await fetchSpot(spot);
  } catch (e) {
    $("body").innerHTML =
      `<b>データを読み込めませんでした。</b><br>${e.message}<br>
       通信環境を確認して再読み込みしてください。`;
    return;
  }
  if (spot !== current) return;

  const isOff = d => angleGap(d, spot.off) <= ARC;
  const hasTide = rows.some(r => r.sl != null);

  /* 現況 */
  const now = new Date();
  const cur = rows.reduce((a, b) => Math.abs(b.t - now) < Math.abs(a.t - now) ? b : a);
  let tideMetric = "";
  if (hasTide && cur.sl != null) {
    const nxt = rows[cur.gi + 1];
    const dir = nxt && nxt.sl != null ? (nxt.sl > cur.sl ? "上げ" : "下げ") : "";
    tideMetric = `
      <div class="metric tide">
        <div class="v">${cur.sl >= 0 ? "+" : ""}${cur.sl.toFixed(2)}<small>m</small></div>
        <div class="k">潮位${dir ? " ・ " + dir : ""}</div>
      </div>`;
  }
  $("now").innerHTML = `
    <div class="metric"><div class="v">${cur.h.toFixed(1)}<small>m</small></div><div class="k">波高</div></div>
    <div class="metric"><div class="v">${cur.p == null ? "—" : cur.p.toFixed(0)}<small>秒</small></div><div class="k">周期</div></div>
    <div class="metric ${isOff(cur.wd) ? "off" : ""}">
      <div class="v">${compass(cur.wd)}<small>${cur.ws.toFixed(1)}m/s</small></div>
      <div class="k">${isOff(cur.wd) ? "オフショア" : "オン・サイド"}</div>
    </div>${tideMetric}`;
  $("now").hidden = false;

  const extrema = hasTide ? findExtrema(rows) : new Map();

  /* 表示時間帯で絞り込んでから日別に束ねる */
  const inRange = rows.filter(r => r.t.getHours() >= HOUR_FROM && r.t.getHours() <= HOUR_TO);
  const days = {};
  inRange.forEach(r => (days[r.t.toDateString()] ||= []).push(r));

  const maxH = Math.max(1.0, Math.ceil(Math.max(...inRange.map(r => r.h)) * 2) / 2);
  const maxW = Math.max(5, Math.ceil(Math.max(...inRange.map(r => r.ws))));
  const sl   = inRange.filter(r => r.sl != null).map(r => r.sl);
  const slMin = sl.length ? Math.min(...sl) : 0;
  const slMax = sl.length ? Math.max(...sl) : 1;

  $("body").className = "";
  $("body").innerHTML = Object.values(days)
    .map(d => dayBlock(d, { maxH, maxW, slMin, slMax, isOff, hasTide, extrema })).join("");

  if (hasTide) {
    $("note").innerHTML = `<div class="note">
      潮位は Copernicus SMOC（8km解像度・全球平均海面基準）の予測値です。
      上げ／下げのタイミングを掴む用途を想定しており、海図や気象庁潮位表とは
      基準面が異なるため cm 値は一致しません。満潮・干潮の時刻は1時間間隔データからの
      推定で ±30分程度の誤差があります。
    </div>`;
  }

  $("stamp").textContent = "更新 " +
    now.toLocaleString("ja-JP", { month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit" });
}

/* 潮位系列の極大・極小 → Map<通し番号, "満"|"干"> */
function findExtrema(rows){
  const m = new Map();
  for (let i = 1; i < rows.length - 1; i++) {
    const a = rows[i - 1].sl, b = rows[i].sl, c = rows[i + 1].sl;
    if (a == null || b == null || c == null) continue;
    if (b >= a && b >= c && !(a === b && b === c)) m.set(i, "満");
    if (b <= a && b <= c && !(a === b && b === c)) m.set(i, "干");
  }
  return m;
}

/* その日の「おすすめ時間帯」（最も長い連続区間を1本） */
function findRecommended(day, isOff){
  const peak = Math.max(...day.map(r => r.h));
  const ok = day.map(r => r.h >= peak * REC_HEIGHT_RATIO && isOff(r.wd));
  let bestStart = -1, bestLen = 0, curStart = -1, curLen = 0;
  ok.forEach((v, i) => {
    if (v) { if (curLen === 0) curStart = i; curLen++; }
    else curLen = 0;
    if (curLen > bestLen) { bestLen = curLen; bestStart = curStart; }
  });
  if (bestLen < REC_MIN_HOURS) return null;
  return { start: bestStart, end: bestStart + bestLen - 1 };
}

function dayBlock(day, o){
  const { maxH, maxW, slMin, slMax, isOff, hasTide, extrema } = o;

  /* 共通レイアウト */
  const W = 720, L = 36, R = 14;
  const x = i => L + i * (W - L - R) / (day.length - 1 || 1);

  /* ---- 波高 ---- */
  const HW = 132, top = 16, base = 100;
  const yW = h => base - (h / maxH) * (base - top);

  const rec = findRecommended(day, isOff);
  const line = day.map((r, i) => `${x(i).toFixed(1)},${yW(r.h).toFixed(1)}`).join(" ");
  const area = `${x(0).toFixed(1)},${base} ${line} ${x(day.length - 1).toFixed(1)},${base}`;

  /* 目盛りは軸の外（左）に置いて線と重ならないようにする */
  let grid = "", yLabels = "";
  for (let g = 0.5; g <= maxH + 1e-9; g += 0.5) {
    const yy = yW(g).toFixed(1);
    grid += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}"
      stroke="var(--hair)" stroke-dasharray="1.5 3.5"/>`;
    yLabels += `<text x="${L - 7}" y="${(+yy + 3).toFixed(1)}" fill="var(--mute)" font-size="8.5"
      text-anchor="end" font-variant-numeric="tabular-nums">${g.toFixed(1)}</text>`;
  }

  const recBand = rec
    ? `<rect x="${x(rec.start).toFixed(1)}" y="${top - 4}"
        width="${Math.max(4, x(rec.end) - x(rec.start)).toFixed(1)}" height="${base - top + 4}"
        fill="var(--good)" opacity=".1" rx="2"/>`
    : "";

  /* 数値ラベルは3時間おきだけ。線の上に十分な余白を取る */
  const valueLabels = day.map((r, i) =>
    r.t.getHours() % 3 ? "" :
    `<text x="${x(i).toFixed(1)}" y="${(yW(r.h) - 9).toFixed(1)}" fill="var(--foam)"
       font-size="10.5" text-anchor="middle" font-weight="600"
       font-variant-numeric="tabular-nums">${r.h.toFixed(1)}</text>`
  ).join("");

  const hourTicks = day.map((r, i) =>
    r.t.getHours() % 3 ? "" :
    `<text x="${x(i).toFixed(1)}" y="${HW - 6}" fill="var(--mute)" font-size="10"
       text-anchor="middle" font-variant-numeric="tabular-nums">${r.t.getHours()}</text>`
  ).join("");

  /* ---- 風（バー＋矢印＋数値） ---- */
  const HB = 86, barBase = 40, barTop = 12;
  const barW = Math.min(16, (W - L - R) / day.length * 0.6);
  const windBars = day.map((r, i) => {
    const bh = Math.max(2, (r.ws / maxW) * (barBase - barTop));
    const c = isOff(r.wd) ? "var(--offshore)" : "var(--wind)";
    return `<rect x="${(x(i) - barW / 2).toFixed(1)}" y="${(barBase - bh).toFixed(1)}"
      width="${barW.toFixed(1)}" height="${bh.toFixed(1)}" rx="1.5" fill="${c}" opacity=".8"/>`;
  }).join("");

  /* 矢印は2時間おき。風が吹いていく向きに回転 */
  const windArrows = day.map((r, i) => {
    if (r.t.getHours() % 2) return "";
    const c = isOff(r.wd) ? "var(--offshore)" : "var(--wind)";
    return `<g transform="translate(${x(i).toFixed(1)},58) rotate(${(r.wd + 180) % 360})">
      <path d="M0,-6.5 L0,6.5 M0,6.5 L-3.4,1.8 M0,6.5 L3.4,1.8"
        stroke="${c}" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>`;
  }).join("");

  const windValues = day.map((r, i) =>
    r.t.getHours() % 2 ? "" :
    `<text x="${x(i).toFixed(1)}" y="78" fill="var(--mute)" font-size="9"
       text-anchor="middle" font-variant-numeric="tabular-nums">${r.ws.toFixed(1)}</text>`
  ).join("");

  /* ---- 潮位 ---- */
  let tideSvg = "";
  if (hasTide && day.some(r => r.sl != null)) {
    const HT = 58, span = (slMax - slMin) || 1;
    const yT = v => 34 - ((v - slMin) / span) * 20;
    const pts = day.map((r, i) => r.sl == null ? null : `${x(i).toFixed(1)},${yT(r.sl).toFixed(1)}`)
                   .filter(Boolean).join(" ");
    const marks = day.map((r, i) => {
      const kind = extrema.get(r.gi);
      if (!kind || r.sl == null) return "";
      const yy = yT(r.sl);
      return `<g>
        <circle cx="${x(i).toFixed(1)}" cy="${yy.toFixed(1)}" r="2.8" fill="var(--tide)"/>
        <text x="${x(i).toFixed(1)}" y="${(kind === "満" ? yy - 8 : yy + 15).toFixed(1)}"
          fill="var(--tide)" font-size="9.5" text-anchor="middle"
          font-variant-numeric="tabular-nums">${kind} ${hhmm(r.t)}</text></g>`;
    }).join("");
    tideSvg = `<svg viewBox="0 0 ${W} ${HT}" role="img" aria-label="潮位">
      <text x="${L - 7}" y="30" fill="var(--mute)" font-size="8.5" text-anchor="end">潮位</text>
      <polyline points="${pts}" fill="none" stroke="var(--tide)" stroke-width="1.8"
        stroke-linejoin="round" opacity=".9"/>${marks}
    </svg>`;
  }

  const d    = day[0].t;
  const wd   = ["日","月","火","水","木","金","土"][d.getDay()];
  const peak = Math.max(...day.map(r => r.h));
  const recLabel = rec
    ? `<span class="badge">🏄 ${day[rec.start].t.getHours()}–${day[rec.end].t.getHours()}時</span>`
    : "";

  return `<div class="day">
    <div class="day-head">
      <span>${d.getMonth() + 1}月${d.getDate()}日（${wd}）${recLabel}</span>
      <span class="peak">最大 ${peak.toFixed(1)}m</span>
    </div>
    <svg viewBox="0 0 ${W} ${HW}" role="img" aria-label="波高（m）">
      ${recBand}${grid}${yLabels}
      <text x="${L - 7}" y="${top - 5}" fill="var(--mute)" font-size="8.5" text-anchor="end">m</text>
      <polygon points="${area}" fill="var(--swell)" opacity=".13"/>
      <polyline points="${line}" fill="none" stroke="var(--swell)" stroke-width="2.2"
        stroke-linejoin="round" stroke-linecap="round"/>
      ${valueLabels}${hourTicks}
    </svg>
    <svg viewBox="0 0 ${W} ${HB}" role="img" aria-label="風速（m/s）と風向">
      <text x="${L - 7}" y="${barBase}" fill="var(--mute)" font-size="8.5" text-anchor="end">m/s</text>
      ${windBars}${windArrows}${windValues}
    </svg>
    ${tideSvg}
  </div>`;
}

render();
</script>
</body>
</html>
