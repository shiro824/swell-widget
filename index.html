<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>うねりライン</title>
<style>
  :root{
    --ink:#0b1a24;
    --foam:#f3f7f8;
    --sand:#d9c39a;
    --swell:#5fc2cc;
    --wind:#94a8b3;
    --offshore:#f2a94e;
    --good:#7fd499;
    --mute:#8199a5;
    --hair:rgba(243,247,248,.12);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--ink)}
  body{
    padding:20px 20px 24px;
    color:var(--foam);
    font-family:"Hiragino Sans","Noto Sans JP",-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* スポット切替 */
  nav{
    display:flex;gap:6px;overflow-x:auto;
    margin:0 -20px 16px;padding:0 20px 8px;
    scrollbar-width:none;
  }
  nav::-webkit-scrollbar{display:none}
  nav button{
    flex:0 0 auto;
    background:none;border:1px solid var(--hair);border-radius:999px;
    color:var(--mute);font:inherit;font-size:12px;letter-spacing:.06em;
    padding:5px 13px;cursor:pointer;white-space:nowrap;
    transition:.15s;
  }
  nav button:hover{color:var(--foam);border-color:rgba(243,247,248,.3)}
  nav button[aria-current="true"]{
    background:var(--foam);border-color:var(--foam);color:var(--ink);font-weight:600;
  }

  .eyebrow{
    display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    font-size:10px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--mute);margin:0 0 6px;
  }
  .eyebrow button{
    background:none;border:none;color:var(--mute);font:inherit;letter-spacing:.1em;
    cursor:pointer;text-decoration:underline;text-underline-offset:2px;
    padding:0;text-transform:none;
  }
  h1{margin:0;font-size:30px;font-weight:600;letter-spacing:.04em;line-height:1.1}
  h1 .geo{font-size:11px;color:var(--mute);letter-spacing:.1em;margin-left:10px;font-weight:400}

  .now{
    display:flex;gap:26px;align-items:baseline;flex-wrap:wrap;
    margin:18px 0 4px;padding-bottom:16px;border-bottom:1px solid var(--hair);
  }
  .metric .v{font-size:27px;font-weight:600;letter-spacing:.02em;font-variant-numeric:tabular-nums}
  .metric .v small{font-size:12px;font-weight:400;color:var(--mute);margin-left:3px}
  .metric .k{font-size:10px;letter-spacing:.16em;color:var(--mute);margin-top:2px}
  .metric.off .v{color:var(--offshore)}

  .day{margin-top:24px}
  .day-head{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:11px;letter-spacing:.14em;color:var(--sand);margin-bottom:3px;
  }
  .day-head .peak{color:var(--mute);letter-spacing:.06em;font-variant-numeric:tabular-nums}
  .badge{
    display:inline-flex;align-items:center;gap:5px;
    background:rgba(127,212,153,.13);color:var(--good);
    border:1px solid rgba(127,212,153,.35);border-radius:999px;
    font-size:10px;letter-spacing:.08em;padding:2px 9px;margin-left:8px;
    font-variant-numeric:tabular-nums;
  }
  svg{display:block;width:100%;height:auto;overflow:visible}
  .wave-svg{margin-bottom:2px}

  .msg{padding:26px 0;color:var(--mute);font-size:13px;line-height:1.8}
  .msg b{color:var(--foam);font-weight:600}

  .tide-box{
    margin-top:22px;padding:14px 16px;border:1px dashed var(--hair);border-radius:10px;
    font-size:11.5px;line-height:1.9;color:var(--mute);
  }
  .tide-box b{color:var(--foam)}

  footer{
    margin-top:22px;padding-top:12px;border-top:1px solid var(--hair);
    font-size:10px;letter-spacing:.08em;color:var(--mute);
    display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
  }
  .key{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .key i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}

  @media (max-width:420px){
    body{padding:16px 14px 20px}
    nav{margin:0 -14px 14px;padding:0 14px 8px}
    h1{font-size:23px}
    h1 .geo{display:block;margin:4px 0 0}
    .now{gap:18px}
    .metric .v{font-size:22px}
  }
</style>
</head>
<body>

<nav id="tabs" aria-label="スポット"></nav>

<div class="eyebrow">
  <span>Open-Meteo Marine / <span id="rangeLabel">5日間</span></span>
  <button id="tideToggle" type="button" hidden>潮位設定</button>
</div>
<h1 id="spotName">—<span class="geo" id="geo"></span></h1>
<div id="now" class="now" hidden></div>
<div id="body" class="msg">うねりデータを取得しています…</div>
<div id="tideBox"></div>

<footer>
  <div class="key">
    <span><i style="background:var(--swell)"></i>波高</span>
    <span><i style="background:var(--offshore)"></i>オフショア風</span>
    <span><i style="background:var(--wind)"></i>オン・サイド風</span>
    <span><i style="background:var(--good)"></i>おすすめ時間帯</span>
  </div>
  <div id="stamp"></div>
</footer>

<script>
/* ------------------------------------------------------------------
   スポット定義
   off  … オフショアと見なす風向の中心角（度）。±ARC で判定する。
   tide … { pc, hc } 潮位API（tide736.net）の都道府県コード／港コード。
          未設定（null）なら潮位セクションは自動的に非表示になる。
          設定方法は同梱の README を参照。
------------------------------------------------------------------ */
const ARC = 45;
const SPOTS = [
  { id:"torami",  name:"東浪見",       lat:35.365, lon:140.405, off:300, tide:{ pc:12, hc:null } },
  { id:"katakai", name:"片貝新堤",     lat:35.516, lon:140.445, off:300, tide:{ pc:12, hc:null } },
  { id:"sakuda",  name:"作田",         lat:35.585, lon:140.487, off:300, tide:{ pc:12, hc:null } },
  { id:"shiina",  name:"椎名内",       lat:35.635, lon:140.553, off:305, tide:{ pc:12, hc:null } },
  { id:"iioka",   name:"飯岡",         lat:35.703, lon:140.725, off:320, tide:{ pc:12, hc:null } },
  { id:"hirai",   name:"鹿嶋平井",     lat:35.948, lon:140.680, off:200, tide:{ pc:8,  hc:null } },
  { id:"sante",   name:"トップサンテ", lat:35.885, lon:140.700, off:210, tide:{ pc:8,  hc:null } },
];

const FORECAST_DAYS = 5;
const REC_HEIGHT_RATIO = 0.55;   // その日の最大波高に対する比率以上
const REC_MIN_HOURS    = 2;      // 最低でも連続何時間続けば表示するか

const DIRS = ["北","北北東","北東","東北東","東","東南東","南東","南南東",
              "南","南南西","南西","西南西","西","西北西","北西","北北西"];
const compass = d => DIRS[Math.round(d / 22.5) % 16];
const gap = (a, b) => { const d = Math.abs(a - b) % 360; return d > 180 ? 360 - d : d; };
const $ = id => document.getElementById(id);

/* ---------- スポットタブ ---------- */
let current = SPOTS.find(s => s.id === location.hash.slice(1)) || SPOTS[0];

$("tabs").innerHTML = SPOTS.map(s =>
  `<button data-id="${s.id}" aria-current="${s.id === current.id}">${s.name}</button>`
).join("");

$("tabs").addEventListener("click", e => {
  const btn = e.target.closest("button");
  if (!btn) return;
  current = SPOTS.find(s => s.id === btn.dataset.id);
  history.replaceState(null, "", "#" + current.id);
  [...$("tabs").children].forEach(b =>
    b.setAttribute("aria-current", b.dataset.id === current.id));
  render();
});

$("rangeLabel").textContent = FORECAST_DAYS + "日間";

/* ---------- データ取得 ---------- */
const cache = new Map();
const tideCache = new Map();

async function grab(url){
  const r = await fetch(url);
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

async function fetchSpot(spot){
  if (cache.has(spot.id)) return cache.get(spot.id);
  const q = `latitude=${spot.lat}&longitude=${spot.lon}&timezone=Asia%2FTokyo&forecast_days=${FORECAST_DAYS}`;
  const [sea, air] = await Promise.all([
    grab(`https://marine-api.open-meteo.com/v1/marine?${q}&hourly=wave_height,wave_period`),
    grab(`https://api.open-meteo.com/v1/forecast?${q}&hourly=wind_speed_10m,wind_direction_10m`)
  ]);
  const rows = sea.hourly.time.map((t, i) => ({
    t : new Date(t),
    h : sea.hourly.wave_height[i],
    p : sea.hourly.wave_period[i],
    ws: air.hourly.wind_speed_10m[i],
    wd: air.hourly.wind_direction_10m[i]
  })).filter(r => r.h != null);
  if (!rows.length) throw new Error("データが空です");
  cache.set(spot.id, rows);
  return rows;
}

/* tide736.net から今日の潮位を取得（hc未設定ならスキップ） */
async function fetchTide(spot){
  if (!spot.tide || !spot.tide.hc) return null;
  const key = spot.tide.pc + ":" + spot.tide.hc;
  if (tideCache.has(key)) return tideCache.get(key);
  const now = new Date();
  const url = `https://api.tide736.net/get_tide.php?pc=${spot.tide.pc}&hc=${spot.tide.hc}` +
              `&yr=${now.getFullYear()}&mn=${now.getMonth() + 1}&dy=${now.getDate()}&rg=day`;
  try {
    const data = await grab(url);
    if (data.status !== 1) throw new Error("no data");
    tideCache.set(key, data);
    return data;
  } catch {
    return null; // 港コードが誤っている等 → 静かにセクションを隠す
  }
}

/* ---------- 描画 ---------- */
async function render(){
  const spot = current;
  $("spotName").firstChild.nodeValue = spot.name;
  $("geo").textContent = `${spot.lat.toFixed(2)}N ${spot.lon.toFixed(2)}E`;
  $("now").hidden = true;
  $("body").className = "msg";
  $("body").textContent = "うねりデータを取得しています…";
  $("tideBox").innerHTML = "";
  $("tideToggle").hidden = !!(spot.tide && spot.tide.hc);
  $("tideToggle").onclick = () => alert(
    "潮位を表示するには index.html 内の SPOTS 配列で、このスポットの\n" +
    "tide: { pc, hc } の hc（港コード）を設定してください。\n" +
    "調べ方は README の「潮位を有効にする」を参照。"
  );

  let rows;
  try {
    rows = await fetchSpot(spot);
  } catch (e) {
    $("body").innerHTML =
      `<b>データを読み込めませんでした。</b><br>${e.message}<br>
       通信環境を確認して再読み込みしてください。`;
    return;
  }
  if (spot !== current) return;

  const isOff = d => gap(d, spot.off) <= ARC;

  /* 現況 */
  const now = new Date();
  const cur = rows.reduce((a, b) => Math.abs(b.t - now) < Math.abs(a.t - now) ? b : a);
  $("now").innerHTML = `
    <div class="metric"><div class="v">${cur.h.toFixed(1)}<small>m</small></div><div class="k">波高</div></div>
    <div class="metric"><div class="v">${cur.p == null ? "—" : cur.p.toFixed(0)}<small>秒</small></div><div class="k">周期</div></div>
    <div class="metric ${isOff(cur.wd) ? "off" : ""}">
      <div class="v">${compass(cur.wd)}<small>${cur.ws.toFixed(0)}m/s</small></div>
      <div class="k">${isOff(cur.wd) ? "オフショア" : "オン・サイド"}</div>
    </div>`;
  $("now").hidden = false;

  /* 日別グラフ */
  const maxH = Math.max(1.2, Math.ceil(Math.max(...rows.map(r => r.h)) * 2) / 2);
  const maxW = Math.max(6, Math.ceil(Math.max(...rows.map(r => r.ws))));
  const days = {};
  rows.forEach(r => (days[r.t.toDateString()] ||= []).push(r));

  $("body").className = "";
  $("body").innerHTML = Object.values(days).map(d => dayBlock(d, maxH, maxW, isOff)).join("");

  $("stamp").textContent = "更新 " +
    now.toLocaleString("ja-JP", { month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit" });

  /* 潮位（設定済みの場合のみ） */
  const tide = await fetchTide(spot);
  if (spot !== current) return;
  if (tide) renderTide(tide);
}

/* その日のうち「おすすめ時間帯」を1本だけ拾う（最も長い連続区間） */
function findRecommended(day, isOff){
  const peak = Math.max(...day.map(r => r.h));
  const ok = day.map(r => r.h >= peak * REC_HEIGHT_RATIO && isOff(r.wd));
  let bestStart = -1, bestLen = 0, curStart = -1, curLen = 0;
  ok.forEach((v, i) => {
    if (v) { if (curLen === 0) curStart = i; curLen++; }
    else curLen = 0;
    if (curLen > bestLen) { bestLen = curLen; bestStart = curStart; }
  });
  if (bestLen < REC_MIN_HOURS) return null;
  return { start: bestStart, end: bestStart + bestLen - 1 };
}

function dayBlock(day, maxH, maxW, isOff){
  const W = 720, HW = 150, HB = 44, PAD = 26;
  const baseW = HW - 34;
  const x = i => PAD + i * (W - PAD * 2) / (day.length - 1 || 1);
  const yW = h => baseW - (h / maxH) * (baseW - 12);

  const rec = findRecommended(day, isOff);

  const line = day.map((r, i) => `${x(i).toFixed(1)},${yW(r.h).toFixed(1)}`).join(" ");
  const area = `${PAD},${baseW} ${line} ${x(day.length - 1).toFixed(1)},${baseW}`;

  const grid = [];
  for (let g = 0.5; g < maxH; g += 0.5) {
    grid.push(`<line x1="${PAD}" x2="${W - PAD}" y1="${yW(g).toFixed(1)}" y2="${yW(g).toFixed(1)}"
      stroke="var(--hair)" stroke-dasharray="1.5 3"/>`);
  }

  const recBand = rec
    ? `<rect x="${x(rec.start).toFixed(1)}" y="8" width="${(x(rec.end) - x(rec.start) || 4).toFixed(1)}"
        height="${baseW - 8}" fill="var(--good)" opacity=".1"/>`
    : "";

  const ticks = day.map((r, i) =>
    r.t.getHours() % 6 ? "" :
    `<text x="${x(i).toFixed(1)}" y="${HW - 3}" fill="var(--mute)" font-size="9.5"
       text-anchor="middle" letter-spacing=".05em">${r.t.getHours()}</text>`
  ).join("");

  const peakIdx = day.reduce((bi, rr, ri) => rr.h > day[bi].h ? ri : bi, 0);
  const valueLabels = day.map((r, i) => {
    const show = i === peakIdx || (r.t.getHours() % 6 === 0 && r.t.getHours() !== 0);
    if (!show) return "";
    return `<text x="${x(i).toFixed(1)}" y="${(yW(r.h) - 8).toFixed(1)}" fill="var(--foam)"
      font-size="10" text-anchor="middle" font-weight="600" font-variant-numeric="tabular-nums">${r.h.toFixed(1)}</text>`;
  }).join("");

  const windBase = HB - 6;
  const windBars = day.map((r, i) => {
    const bw = (W - PAD * 2) / day.length * 0.55;
    const bh = Math.max(1.5, (r.ws / maxW) * (HB - 14));
    const c = isOff(r.wd) ? "var(--offshore)" : "var(--wind)";
    return `<rect x="${(x(i) - bw / 2).toFixed(1)}" y="${(windBase - bh).toFixed(1)}"
      width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="1.5" fill="${c}" opacity=".85"/>`;
  }).join("");
  const windTicks = day.map((r, i) =>
    r.t.getHours() % 6 || r.t.getHours() === 0 ? "" :
    `<text x="${x(i).toFixed(1)}" y="${HB - 1}" fill="var(--mute)" font-size="8"
       text-anchor="middle">${r.ws.toFixed(0)}</text>`
  ).join("");

  const d    = day[0].t;
  const wd   = ["日","月","火","水","木","金","土"][d.getDay()];
  const peak = Math.max(...day.map(r => r.h));
  const recLabel = rec
    ? `<span class="badge">🏄 ${day[rec.start].t.getHours()}–${day[rec.end].t.getHours()}時</span>`
    : "";

  return `<div class="day">
    <div class="day-head">
      <span>${d.getMonth() + 1}月${d.getDate()}日（${wd}）${recLabel}</span>
      <span class="peak">最大 ${peak.toFixed(1)}m</span>
    </div>
    <svg class="wave-svg" viewBox="0 0 ${W} ${HW}" role="img" aria-label="${d.getMonth() + 1}月${d.getDate()}日の波高推移">
      ${recBand}${grid}
      <line x1="${PAD}" y1="${baseW}" x2="${W - PAD}" y2="${baseW}" stroke="rgba(243,247,248,.2)"/>
      <polygon points="${area}" fill="var(--swell)" opacity=".14"/>
      <polyline points="${line}" fill="none" stroke="var(--swell)" stroke-width="2.2"
        stroke-linejoin="round" stroke-linecap="round"/>
      ${valueLabels}${ticks}
      <text x="${PAD}" y="16" fill="var(--mute)" font-size="9" letter-spacing=".05em">${maxH}m</text>
    </svg>
    <svg viewBox="0 0 ${W} ${HB}" role="img" aria-label="${d.getMonth() + 1}月${d.getDate()}日の風速">
      ${windBars}${windTicks}
      <text x="${PAD}" y="12" fill="var(--mute)" font-size="8" letter-spacing=".05em">m/s</text>
    </svg>
  </div>`;
}

function renderTide(data){
  const port = data.tide.port.harbor_namej;
  const today = Object.keys(data.tide.chart)[0];
  const c = data.tide.chart[today];
  const moon = c.moon;
  const events = [
    ...c.flood.map(e => ({ ...e, label:"満潮" })),
    ...c.edd.map(e => ({ ...e, label:"干潮" }))
  ].sort((a, b) => a.unix - b.unix);

  $("tideBox").innerHTML = `
    <div class="tide-box">
      <b>${port}の潮汐</b> ／ ${moon.title}（月齢 ${Number(moon.age).toFixed(1)}）<br>
      ${events.map(e => `${e.label} ${e.time}（${Math.round(e.cm)}cm）`).join(" ・ ")}
    </div>`;
}

render();
</script>
</body>
</html>
